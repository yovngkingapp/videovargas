name: Generate Project Structure with StructKit

on:
  workflow_dispatch: # Se puede ejecutar manualmente desde la pestaña "Actions"
  push:
    paths:
      - '.structkit.yaml' # Se ejecuta si cambias el archivo de estructura

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install StructKit
        uses: httpdss/structkit-setup@v0

      - name: Generate structure from .structkit.yaml
        uses: httpdss/structkit-action@v0
        with:
          command: generate
          struct_file: .structkit.yaml
          output_dir: .

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate project structure" && git push)
